<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Örnek Kafe</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #333; }
    header { background: #6f4e37; color: white; text-align: center; padding: 60px 20px; }
    section { max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h2 { color: #6f4e37; }
    .urun { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 8px 0; }
    footer { background: #333; color: white; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Örnek Kafe</h1>
    <p>Taze kahve, ev yapımı tatlılar</p>
  </header>

  <section>
    <h2>Menü</h2>
    <div class="urun"><span>Filtre Kahve</span><span>80 TL</span></div>
    <div class="urun"><span>Latte</span><span>110 TL</span></div>
    <div class="urun"><span>Cheesecake</span><span>140 TL</span></div>
  </section>

  <section>
    <h2>Çalışma Saatleri</h2>
    <p>Her gün 08:00 - 22:00</p>
  </section>

  <footer>
    <p>İletişim: 0555 000 00 00</p>
  </footer>
</body>
</html>
